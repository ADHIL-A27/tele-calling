{% extends "base.html" %}
{% block title %}Password reset complete{% endblock %}
{% block auth_content %}
<div class="tw-min-h-screen tw-flex tw-items-center tw-justify-center tw-p-4">
  <div class="clay-card tw-text-center" style="max-width:420px; width:100%;">
    <span class="material-symbols-outlined" style="font-size:42px;color:#7fd1ae;">check_circle</span>
    <h1 class="tw-text-lg tw-font-bold tw-mt-3 tw-mb-2">Password updated</h1>
    <p class="tw-text-sm" style="color:var(--clay-text-muted);">You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="clay-button clay-button--primary tw-mt-5 tw-inline-flex">Go to login</a>
  </div>
</div>
{% endblock %}
