{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="tw-min-h-screen tw-flex tw-items-center tw-justify-center tw-p-4">
  <div class="clay-card" style="max-width:420px; width:100%;">
    <h1 class="tw-text-lg tw-font-bold tw-mb-2">Reset your password</h1>
    <p class="tw-text-sm tw-mb-5" style="color:var(--clay-text-muted);">
      Enter your account email and we'll send you a reset link.
    </p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="clay-field">
        <label for="{{ form.email.id_for_label }}">Email</label>
        {{ form.email }}
      </div>
      <button type="submit" class="clay-button clay-button--primary tw-w-full">Send reset link</button>
    </form>
    <div class="tw-text-center tw-mt-5">
      <a href="{% url 'accounts:login' %}" class="tw-text-sm tw-font-semibold" style="color:#5a74d6;">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
