{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block auth_content %}
<div class="tw-min-h-screen tw-flex tw-items-center tw-justify-center tw-p-4">
  <div class="clay-card tw-text-center" style="max-width:420px; width:100%;">
    <span class="material-symbols-outlined" style="font-size:42px;color:#5a74d6;">mark_email_read</span>
    <h1 class="tw-text-lg tw-font-bold tw-mt-3 tw-mb-2">Check your email</h1>
    <p class="tw-text-sm" style="color:var(--clay-text-muted);">
      If an account exists with that email, a password reset link has been sent.
    </p>
    <a href="{% url 'accounts:login' %}" class="clay-button clay-button--primary tw-mt-5 tw-inline-flex">Back to login</a>
  </div>
</div>
{% endblock %}
